name: NPRM comments refresh

# Autonomously refresh the NPRM docket comments ~3x/day at 10am, 5pm, and 10pm
# US Pacific. GitHub cron is UTC and does not observe DST, so we schedule the
# UTC hours for BOTH PST (UTC-8) and PDT (UTC-7). Do not gate on the current
# Pacific hour: GitHub often starts scheduled jobs hours late, and a strict
# hour check would skip the pull (which froze the site count after Aug 28).
on:
  schedule:
    # 10am PT = 17/18 UTC · 5pm PT = 00/01 UTC · 10pm PT = 05/06 UTC
    - cron: '0 0,1,5,6,17,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nprm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # GitHub cron is often 1–4+ hours late. The old "Pacific hour must be
      # exactly 10/17/22" gate then skipped the run, so the site froze on the
      # last on-time pull (e.g. Aug 28 10:04 AM PDT while later crons no-op'd).
      # Always pull on schedule/dispatch. The 6 UTC cron times still give PST
      # and PDT three attempts/day; comment-diff + once-per-Pacific-day
      # heartbeat already prevent extra commits.

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest NPRM comments
        env:
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
        run: npm run nprm:pull-comments

      - name: Commit changes / daily check heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Did the comment set actually change? (compare only comments, not the
          # run timestamps, to avoid noise commits.)
          git show HEAD:public/data/nprm/all_comments.json | jq -S '.comments' > /tmp/old.json 2>/dev/null || echo '[]' > /tmp/old.json
          jq -S '.comments' public/data/nprm/all_comments.json > /tmp/new.json

          if ! diff -q /tmp/old.json /tmp/new.json >/dev/null; then
            # New / changed comments: publish the full refreshed dataset.
            git add public/data/nprm
            git commit -m "chore(nprm): scheduled comment refresh ($(TZ=America/Los_Angeles date '+%Y-%m-%d %I:%M %p %Z'))"
            git push
            exit 0
          fi

          # No comment change. Publish only the last-check heartbeat so the site
          # can show "still checking" - and at most once per Pacific day, so we
          # don't trigger 3 redeploys/day or churn the big data files.
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          PREV_ISO=$(git show HEAD:public/data/nprm/last-check.json 2>/dev/null | jq -r '(.pulled_at // "")')
          PREV_DAY=""
          if [ -n "$PREV_ISO" ] && [ "$PREV_ISO" != "null" ]; then
            PREV_DAY=$(TZ=America/Los_Angeles date -d "$PREV_ISO" +%Y-%m-%d)
          fi
          if [ "$PREV_DAY" = "$TODAY" ]; then
            echo "No new comments; heartbeat already committed today ($TODAY)."
            exit 0
          fi

          # Keep the big files unchanged (their only diff is a fresh timestamp);
          # commit just the heartbeat.
          git checkout -- public/data/nprm/all_comments.json public/data/nprm/stats.json public/data/nprm/check.log 2>/dev/null || true
          git add public/data/nprm/last-check.json
          if git diff --cached --quiet; then
            echo "Heartbeat unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(nprm): daily check heartbeat, no new comments ($(TZ=America/Los_Angeles date '+%Y-%m-%d %I:%M %p %Z'))"
          git push
